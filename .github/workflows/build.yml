name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # CommonResponseTest 不依赖外部服务；
      # StarterApplicationTests 需要 MySQL/Redis，已用 STARTER_IT 开关默认跳过。
      - name: Test
        run: ./mvnw -B test --no-transfer-progress
