spring.application.name=starter
spring.mvc.servlet.path=/api

# ==================== 数据库 ====================
# 建库脚本见仓库根目录 sql/schema.sql
# 默认库名 starter_db，本地 MySQL 可直接用
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:starter_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== Redis ====================
# 登录态、短信验证码、分布式锁都放在这里
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=5000

# ==================== 阿里云短信 ====================
# AccessKey 走阿里云默认凭据链，不写进配置文件：
#   ALIBABA_CLOUD_ACCESS_KEY_ID / ALIBABA_CLOUD_ACCESS_KEY_SECRET
# 下面三项按你在短信控制台申请的值填，或直接用环境变量覆盖
aliyun.sms.endpoint=${ALIYUN_SMS_ENDPOINT:dypnsapi.aliyuncs.com}
aliyun.sms.sign-name=${ALIYUN_SMS_SIGN_NAME:你的短信签名}
aliyun.sms.template-code=${ALIYUN_SMS_TEMPLATE_CODE:100001}
aliyun.sms.code-expire-minutes=5

# ==================== 密码摘要盐 ====================
# ⚠️ 上线前必须换成你自己的随机值。盐一换，已入库的密码摘要全部失效，只能让用户重置密码。
auth.password-salt=${AUTH_PASSWORD_SALT:CHANGE_ME_PASSWORD_SALT}

# ==================== MyBatis-Plus ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 需要看 SQL 时取消注释（会把每条 SQL 打到 stdout，生产环境不要开）
#mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 接口文档 ====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.fu.example.starter
# knife4j 的增强配置，不需要增强可以去掉
knife4j.enable=true
knife4j.setting.language=zh_cn
